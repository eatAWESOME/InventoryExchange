import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import moze_intel.projecte.UpdateJson

import java.util.function.Consumer

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'net.neoforged.moddev' version '2.0.78'
    // id 'net.neoforged.gradle.userdev' version '7.0.192'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    gradleVersion = '8.12.1'
    distributionType = Wrapper.DistributionType.ALL
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

version = mod_version
group = mod_group_id

defaultTasks 'build'

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        
        //Exclude directories from being managed
        for (String excludeDirName in ["run", "out", "logs", "gradle"]) {
            excludeDirs.add(new File(projectDir, excludeDirName))
        }
    }
}

// Include resources generated by data generators.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/datagen/generated']
            exclude '.cache'
        }
    }

    api {
        java {
            srcDirs = ['src/api/java']
        }
        resources {
            srcDirs = [] // API has no resources
        }
    }

    datagen {
        java {
            srcDirs = ['src/datagen/java']
        }
        resources {
            srcDirs = ['src/datagen/resources']
        }
    }

    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = [] // test resources if needed
        }
    }

    runMain {
        java {
            srcDirs = [] // empty; only for dependency graph
        }
        resources {
            srcDirs = []
        }
    }

    runData {
        java {
            srcDirs = [] // empty; only for dependency graph
        }
        resources {
            srcDirs = []
        }
    }
}

sourceSets.main.compileClasspath += sourceSets.api.output
sourceSets.main.runtimeClasspath += sourceSets.api.output

sourceSets.datagen.compileClasspath += sourceSets.api.output + sourceSets.main.output
sourceSets.datagen.runtimeClasspath += sourceSets.api.output + sourceSets.main.output

sourceSets.test.compileClasspath += sourceSets.api.output + sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.api.output + sourceSets.main.output

sourceSets.runMain.compileClasspath += sourceSets.main.output + sourceSets.api.output
sourceSets.runMain.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.api.runtimeClasspath

sourceSets.runData.compileClasspath += sourceSets.runMain.compileClasspath + sourceSets.datagen.compileClasspath
sourceSets.runData.runtimeClasspath += sourceSets.runMain.runtimeClasspath + sourceSets.datagen.runtimeClasspath

configurations {
    apiImplementation.extendsFrom implementation
    testImplementation.extendsFrom implementation, apiImplementation
    datagenImplementation.extendsFrom implementation, apiImplementation
    apiCompileOnly.extendsFrom compileOnly
    testCompileOnly.extendsFrom compileOnly, apiCompileOnly
    datagenCompileOnly.extendsFrom compileOnly, apiCompileOnly
    apiRuntimeOnly.extendsFrom runtimeOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly, apiRuntimeOnly
    apiLocalRuntime.extendsFrom localRuntime
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
        vendor.set(JvmVendorSpec.JETBRAINS)
    }
    withSourcesJar()
}

neoForge {
    enable {
        version = neo_version
        enabledSourceSets = sourceSets // All source sets use Minecraft code
    }

    accessTransformers.from(
            file('src/main/resources/META-INF/accesstransformer.cfg'),
            //Dev time only ATs so the file name doesn't have to match accesstransformer.cfg
            file('src/datagen/resources/META-INF/datagen_ats.cfg')
    )

    mods {
        inventoryexchange {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
        inventoryexchange_datagen {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
            sourceSet(sourceSets.datagen)
        }
    }

    unitTest {
        enable()
        testedMod = mods.inventoryexchange
        loadedMods = [mods.inventoryexchange]
    }
}

neoForge.runs {
    configureEach {
        if (project.hasProperty('forge_force_ansi')) {
            // Force ansi if declared as a gradle variable, as the auto detection doesn't detect IntelliJ properly
            // or eclipse's plugin that adds support for ansi escape in console
            systemProperties.put('terminal.ansi', (String) property('forge_force_ansi'))
        }
        systemProperties.put('inventoryexchange.skip_top', "true")

        //if the selected toolchain is a JBR, enable DCEVM
        if (javaToolchains.launcherFor(java.toolchain).map { it.metadata.vendor }.getOrElse('').contains('JetBrains')) {
            jvmArguments.addAll('-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition')
        }

        sourceSet = sourceSets.runMain
    }
    client {
        client()
        //Note: To enable logging into the client account, set the mc_devlogin property to true in your gradle user home
        if (findProperty('mc_devlogin') ?: false) {
            //If the property is present and set to true, enable dev login
            devLogin = true
        }
    }
    clientAlt {
        client()
        // Force a different username in case devlogin is not enabled for the main run
        programArguments.addAll((String[]) ['--username', 'AltDev'])
    }
    server {
        server()
        programArgument('--nogui')
    }
    data {
        data()
        programArguments.addAll('--all', '--output', project.file('src/datagen/generated/').getAbsolutePath(),
                '--mod', 'inventoryexchange', '--existing', project.file('src/main/resources/').getAbsolutePath())

        sourceSet = sourceSets.runData
        loadedMods = [neoForge.mods.inventoryexchange_datagen]
    }
}

static void exclusiveRepo(RepositoryHandler handler, String url, String... groups) {
    exclusiveRepo(handler, url, filter -> {
        for (def group : groups) {
            filter.includeGroup(group)
        }
    })
}

static void exclusiveRepo(RepositoryHandler handler, String url, Consumer<InclusiveRepositoryContentDescriptor> filterSetup) {
    handler.exclusiveContent {
        it.forRepositories(handler.maven {
            setUrl(url)
        })
        it.filter { f -> filterSetup.accept(f) }
    }
}

repositories { RepositoryHandler handler ->
    exclusiveRepo(handler, 'https://maven.blamejared.com', filter -> {
        filter.includeGroupAndSubgroups('com.blamejared')
        filter.includeGroup('mezz.jei')
        filter.includeGroup('org.openzen.zencode')
    })
    exclusiveRepo(handler, 'https://maven.terraformersmc.com/', 'dev.emi')
    exclusiveRepo(handler, 'https://maven.theillusivec4.top/', 'top.theillusivec4.curios')
    exclusiveRepo(handler, 'https://maven2.bai.lol', 'lol.bai', 'mcp.mobius.waila')//WTHIT
    exclusiveRepo(handler, 'https://modmaven.dev/', 'mcjty.theoneprobe')
    exclusiveRepo(handler, 'https://www.cursemaven.com', 'curse.maven')
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junit_version}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junit_version}")
    testImplementation("net.neoforged:testframework:${neo_version}") {
        transitive = false
    }

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    if (recipe_viewer == 'jei' || recipe_viewer == 'hybrid') {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    }

    compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
    def emi = "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
    datagenCompileOnly(emi)
    if (recipe_viewer == 'emi' || recipe_viewer == 'hybrid') {
        localRuntime(emi)
    } else {
        datagenRuntimeOnly(emi)
    }


    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}:api") {
        transitive = false
    }
    localRuntime("mcjty.theoneprobe:theoneprobe:${top_version}") {
        transitive = false
    }
    compileOnly("curse.maven:jade-api-324717:${jade_api_id}")
    localRuntime("curse.maven:jade-324717:${jade_id}")
    compileOnly("mcp.mobius.waila:wthit-api:forge-${wthit_version}")

    def crt = "com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}"
    compileOnly(crt)
    localRuntime(crt)

    additionalRuntimeClasspath(implementation(shadow(group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1')))
}

//Set the various variables/settings for the different process resources tasks
tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude('META-INF/neoforge.mods.toml')
    finalizedBy(replaceResources)
    def files = fileTree(dir: outputs.files.asPath, includes: ['**/*.json', '**/*.mcmeta'])
    doLast {
        for (def file : files) {
            file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}

def replaceResources = tasks.register("replaceResources", Copy) {
    def versionProperties = ["version": mod_version, "mc_version": minecraft_version, "neo_version": neo_version, "loader_version_range": loader_version_range, "mod_license": mod_license, "mod_id": mod_id, "mod_version": mod_version, "mod_name": mod_name, "mod_authors": mod_authors, "mod_description": mod_description, "minecraft_version_range": minecraft_version_range]
    inputs.properties(versionProperties)
    def modsToml = copySpec {
        from(sourceSets.main.resources) {
            include "META-INF/neoforge.mods.toml"
            expand versionProperties
        }
    }
    //Copy it into the build dir
    it.with modsToml
    it.into layout.buildDirectory.dir('resources/main/')
    //If IntelliJ's output dir exists, copy it there as well
    if (new File("$rootDir/out/production/").exists()) {
        copy {
            with modsToml
            into "$rootDir/out/production/"
        }
    }
    //If Eclipse's output dir exists, copy it there as well
    if (new File("$rootDir/bin/main/").exists()) {
        copy {
            with modsToml
            into "$rootDir/bin/main/"
        }
    }
}

//Make the various classes tasks depend on the corresponding replaceResources tasks in addition to the default processResources tasks they depend on
tasks.named('classes') { dependsOn(replaceResources) }

def getManifestAttributes() {
    return [
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_name,
            "Specification-Version"   : "${mod_version}",
            "Implementation-Title"    : mod_name,
            "Implementation-Version"  : "${mod_version}",
            "Implementation-Vendor"   : mod_name,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "Automatic-Module-Name"   : mod_id
    ]
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from([sourceSets.api.output, sourceSets.main.output])
    manifest.attributes(getManifestAttributes())
    finalizedBy(shadowJar)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(classes, apiClasses)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    //Note: Already contains main source set's sources by default
    from(sourceSets.api.allJava)
    manifest.attributes(getManifestAttributes())
}

def apiJar = tasks.register('apiJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    archiveClassifier.set("api")
    from(sourceSets.api.output)
    manifest.attributes(getManifestAttributes())
}

def shadowJar = tasks.named('shadowJar', ShadowJar) {
    //Note: We use the include duplicate strategy instead of FAIL as minimize causes
    // the things to get "added" twice but it is filtered separately by the shadow
    // plugin anyways
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier.set('') // Replace the default JAR
    from([sourceSets.api.output, sourceSets.main.output])

    configurations = [project.configurations.shadow]
    exclude('assets/org/**')
    exclude('META-INF/maven/**')
    exclude('META-INF/*.txt')
    // Relocate apache commons-math3 to prevent conflicts with other mods that include it
    relocate('org.apache.commons.math3', 'moze_intel.projecte.shaded.org.apache.commons.math3')
    // Minimize the required files so we only include what is needed
    minimize()
}

tasks.register('updateJSON', UpdateJson)

tasks.withType(JavaCompile).configureEach({
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
})

tasks.withType(Javadoc).configureEach({
    options.encoding = 'UTF-8'
    options.tags = [
            'apiNote:a:<em>API Note:</em>',
            'implSpec:a:<em>Implementation Requirements:</em>',
            'implNote:a:<em>Implementation Note:</em>'
    ]
})

artifacts {
    archives(apiJar)
    archives(shadowJar)
    archives(sourcesJar)
}

publishing {
    publications { PublicationContainer publicationContainer ->
        shadow(MavenPublication) { MavenPublication publication ->
            publication.from((SoftwareComponent) components.shadow)
            publication.groupId = project.group
            publication.version = project.version
            publication.artifactId = 'InventoryExchange'
            publication.artifacts = [apiJar, shadowJar, sourcesJar]
            publication.pom {
                name.set('InventoryExchange')
                packaging = 'jar'
                scm {
                    url.set('https://github.com/eatAWESOME/InventoryExchange.git')
                }
                issueManagement {
                    system.set('github')
                    url.set('https://github.com/eatAWESOME/InventoryExchange/issues')
                }
                licenses {
                    license {
                        name.set('MIT')
                        distribution.set('repo')
                    }
                }
            }
        }
    }
}